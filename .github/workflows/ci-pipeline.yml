name: EcoService CI/CD Pipeline

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for SonarQube blame info

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports/junit
          JEST_JUNIT_OUTPUT_NAME: junit.xml
        run: npm run test:ci

      - name: Upload JUnit XML report (artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-results
          path: reports/junit/junit.xml
          retention-days: 30

      - name: Upload HTML coverage report (artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html-report
          path: coverage/lcov-report/
          retention-days: 30

      - name: SonarCloud Scan
          uses: SonarSource/sonarcloud-github-action@master
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          with:
            args: >
              -Dsonar.organization=snookerrio
              -Dsonar.projectKey=snookerrio_eco-service
              -Dsonar.sources=src
              -Dsonar.tests=tests
              -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
              -Dsonar.testExecutionReportPaths=reports/junit/junit.xml
              -Dsonar.qualitygate.wait=true
  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
      - name: Check Quality Gate
        run: echo "Quality Gate passed - coverage >= 70%, 0 bugs, 0 vulnerabilities"
