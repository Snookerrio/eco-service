sonar.projectKey=eco-service
sonar.projectName=Eco-Service
sonar.projectVersion=1.0.0

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=reports/junit/junit.xml

# Exclusions
sonar.exclusions=node_modules/**,coverage/**,docs/**

# Quality gate thresholds (enforced via SonarQube UI / Quality Gate config)
# Coverage: 70%+, Bugs: 0, Vulnerabilities: 0, Code Smells: A or B
